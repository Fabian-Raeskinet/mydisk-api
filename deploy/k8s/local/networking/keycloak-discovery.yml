apiVersion: v1
kind: Service
metadata:
  name: mydisk-keycloak-ingress
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: https
      port: 8443
      targetPort: websecure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  mydisk-keycloak.override: |
    rewrite name exact auth.mydisk.localhost. mydisk-keycloak-ingress.kube-system.svc.cluster.local.
