apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps/api/k8s/overlays/local
  - ../../../apps/grafana/k8s/overlays/local
  - ../../../apps/frontend/k8s/overlays/local
  - ../../../apps/keycloak/k8s/overlays/local

components:
  - ../routing

patches:
  - target:
      kind: Ingress
      name: mydisk-api(-https)?
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          mydisk.io/deploy-after-frontend: "true"
  - target:
      kind: Ingress
      name: mydisk-api-https
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: default-same-origin-api@kubernetescrd
