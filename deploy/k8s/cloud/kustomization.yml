apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps/api/k8s/overlays/cloud
  - ../../../apps/frontend/k8s/overlays/cloud

components:
  - ../routing

patches:
  - target:
      kind: Ingress
      name: mydisk-api(-http)?
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          mydisk.io/deploy-after-frontend: "true"
  - target:
      kind: Ingress
      name: mydisk-api
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: mydisk-same-origin-api@kubernetescrd
