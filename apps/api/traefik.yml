http:
  routers:
    api:
      rule: 'PathRegexp(`^/(api|health|maintenance|swagger)(/|$)`)'
      service: api
      middlewares: [same-origin]
    frontend:
      rule: 'PathPrefix(`/`)'
      service: frontend
  middlewares:
    same-origin:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: ""
          X-Content-Type-Options: nosniff
          Referrer-Policy: strict-origin-when-cross-origin
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8080
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
