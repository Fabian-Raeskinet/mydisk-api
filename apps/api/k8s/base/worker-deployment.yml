apiVersion: apps/v1
kind: Deployment

metadata:
  name: mydisk-worker
  labels:
    mydisk.io/deploy-after-migrations: "true"

spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mydisk-worker

  template:
    metadata:
      labels:
        app: mydisk-worker

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: mydisk-worker:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          envFrom:
            - configMapRef:
                name: db-config
            - configMapRef:
                name: worker-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_APP_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_APP_USER);Password=$(DB_PASSWORD);GSS Encryption Mode=Disable"
