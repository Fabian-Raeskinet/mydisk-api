apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - https-redirect.yml
  - https.yml

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - Https__TerminatedAtProxy=true
      - Authentication__Authority=https://auth.mydisk.localhost:8443/realms/mydisk
      - Authentication__Audience=mydisk-api
      - SSL_CERT_DIR=/etc/ssl/certs:/etc/mydisk/keycloak-ca
  - name: keycloak-dev-ca
    files:
      - rootCA.pem=.tls/rootCA.pem
  - name: migrations-config
    behavior: merge
    literals:
      - SEED_DATA=true
  - name: worker-config
    behavior: merge
    literals:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMq__HostName=mydisk-messaging
      - ReviewModeration__SimulatedLatency=00:00:03

secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env # generated by `make k8s-init-secrets`

  - name: mydisk-api-local-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=.tls/tls.crt
      - tls.key=.tls/tls.key
    options:
      disableNameSuffixHash: true

patches:
  - path: api-ingress-http.yml
  - target:
      kind: Deployment
      name: mydisk-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: keycloak-dev-ca
            mountPath: /etc/mydisk/keycloak-ca
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: keycloak-dev-ca
            configMap:
              name: keycloak-dev-ca
  - target:
      kind: Deployment
      name: mydisk-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          prefix: RabbitMq__
          secretRef:
            name: rabbitmq-credentials
