name: mydisk-api

x-db-connection: &db-connection "Host=postgres;Port=5432;Database=mydisk;Username=mydisk;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans postgres.env};GSS Encryption Mode=Disable"

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/mydisk.yml
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/mydisk.yml:ro
    networks:
      - mydisk-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: mydisk-frontend:dev
    restart: unless-stopped
    networks:
      - mydisk-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: mydisk-api:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Https__TerminatedAtProxy: "true"
      ConnectionStrings__DefaultConnection: *db-connection
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - mydisk-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: mydisk-api-migrations:dev
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: *db-connection
      SEED_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mydisk-network

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans postgres.env}
      POSTGRES_USER: mydisk
      POSTGRES_DB: mydisk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydisk -d mydisk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mydisk-network

networks:
  mydisk-network:
    driver: bridge

volumes:
  postgres_data:
