apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mydisk-messaging
spec:
  serviceName: mydisk-messaging
  replicas: 1
  selector:
    matchLabels:
      app: mydisk-messaging
  template:
    metadata:
      labels:
        app: mydisk-messaging
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: UserName
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: Password
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/definitions
              readOnly: true
          # load_definitions would skip seeding the default user, so the topology is imported once the node runs.
          # The CLI must not run before the server has created its Erlang cookie, or the cookie ends up owned by root.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -ec
                  - |
                    i=0
                    until [ -s /var/lib/rabbitmq/.erlang.cookie ] && rabbitmq-diagnostics -q check_running >/dev/null 2>&1; do
                      i=$((i + 1)); [ "$i" -lt 60 ] || exit 1
                      sleep 2
                    done
                    rabbitmqctl -q import_definitions /etc/rabbitmq/definitions/definitions.json
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
      volumes:
        - name: rabbitmq-definitions
          configMap:
            name: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
