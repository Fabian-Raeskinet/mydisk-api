server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Do not cache the entrypoint or config across releases.
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ ^/appsettings.*\.json$ { add_header Cache-Control "no-store"; try_files $uri =404; }
    location /_framework/ {
        # Missing WASM/JS must return 404, not the SPA shell.
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
}
