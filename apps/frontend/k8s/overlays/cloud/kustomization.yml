apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mydisk

resources:
  - ../../base

images:
  - name: mydisk-frontend
    newName: ghcr.io/fabian-raeskinet/mydisk-frontend
    newTag: latest

replicas:
  - name: mydisk-frontend
    count: 2

patches:
  - target:
      kind: Deployment
      name: mydisk-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://mydisk-api.mydisk.svc.cluster.local:80
