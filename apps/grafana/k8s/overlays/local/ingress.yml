apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mydisk-grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mydisk-grafana
                port:
                  number: 80