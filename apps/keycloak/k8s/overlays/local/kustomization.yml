apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - keycloak-ingress.yml

configMapGenerator:
  - name: keycloak-local-realm
    files:
      - mydisk-realm.json
  - name: keycloak-login-theme
    files:
      - themes/mydisk/login/theme.properties
      - themes/mydisk/login/resources/css/mydisk.css
      - themes/mydisk/login/messages/messages_fr.properties

secretGenerator:
  - name: keycloak-postgres-secret
    envs:
      - postgres.env

  - name: keycloak-admin-secret
    envs:
      - keycloak.env

  - name: keycloak-local-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=.tls/tls.crt
      - tls.key=.tls/tls.key
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --import-realm
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: realm-import
            mountPath: /opt/keycloak/data/import
            readOnly: true
          - name: login-theme
            mountPath: /opt/keycloak/themes/mydisk/login
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: realm-import
            configMap:
              name: keycloak-local-realm
          - name: login-theme
            configMap:
              name: keycloak-login-theme
              items:
                - key: theme.properties
                  path: theme.properties
                - key: mydisk.css
                  path: resources/css/mydisk.css
                - key: messages_fr.properties
                  path: messages/messages_fr.properties
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME
          value: https://auth.mydisk.localhost:8443
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: "true"
