apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - keycloak-ingress.yml

configMapGenerator:
  - name: keycloak-local-realm
    files:
      - mydisk-realm.json

secretGenerator:
  - name: keycloak-postgres-secret
    envs:
      - postgres.env

  - name: keycloak-admin-secret
    envs:
      - keycloak.env

  - name: keycloak-local-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=.tls/tls.crt
      - tls.key=.tls/tls.key
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --import-realm
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: realm-import
            mountPath: /opt/keycloak/data/import
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: realm-import
            configMap:
              name: keycloak-local-realm
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME
          value: https://auth.mydisk.localhost:8443
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: "true"
