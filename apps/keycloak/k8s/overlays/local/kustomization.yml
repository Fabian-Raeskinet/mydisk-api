apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - keycloak-ingress.yml

secretGenerator:
  - name: keycloak-postgres-secret
    envs:
      - postgres.env

  - name: keycloak-admin-secret
    envs:
      - keycloak.env

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME
          value: http://auth.mydisk.localhost:8080
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: "true"