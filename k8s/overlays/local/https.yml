apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-https-redirect
spec:
  redirectScheme:
    scheme: https
    port: "8443"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mydisk-api-https
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - localhost
      secretName: mydisk-api-local-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mydisk-api
                port:
                  name: http
