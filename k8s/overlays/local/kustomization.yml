apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - https.yml

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - Https__TerminatedAtProxy=true
  - name: migrations-config
    behavior: merge
    literals:
      - SEED_DATA=true

secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env # generated by `make k8s-init-secrets`

  - name: mydisk-api-local-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=.tls/tls.crt
      - tls.key=.tls/tls.key
    options:
      disableNameSuffixHash: true

patches:
  - path: api-ingress-http.yml
