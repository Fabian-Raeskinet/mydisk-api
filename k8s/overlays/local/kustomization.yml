apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development

secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env # generated by `make k8s-init-secrets`
