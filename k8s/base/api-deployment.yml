apiVersion: apps/v1
kind: Deployment

metadata:
  name: mydisk-api
  labels:
    mydisk.io/deploy-after-migrations: "true"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mydisk-api

  template:
    metadata:
      labels:
        app: mydisk-api

    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: mydisk-api:dev
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: db-config
            - configMapRef:
                name: api-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_APP_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_APP_USER);Password=$(DB_PASSWORD);GSS Encryption Mode=Disable"
