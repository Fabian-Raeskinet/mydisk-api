
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mydisk-api
  labels:
    mydisk.io/deploy-after-migrations: "true"

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: mydisk-api

  template:
    metadata:
      labels:
        app: mydisk-api

    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: mydisk-api:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          ports:
            - containerPort: 8080
              name: http

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: db-config
            - configMapRef:
                name: api-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_APP_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_APP_USER);Password=$(DB_PASSWORD);GSS Encryption Mode=Disable"
