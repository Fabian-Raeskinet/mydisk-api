
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: mydisk-api

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mydisk-api

  minReplicas: 1
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 10
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
