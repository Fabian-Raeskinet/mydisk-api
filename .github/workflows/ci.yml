name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      push-images:
        type: boolean
        default: false
    outputs:
      image-tag:
        value: ${{ jobs.images.outputs.image-tag }}

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Audit NuGet dependencies
        run: make security-dependencies

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: security-reports/nuget*
          if-no-files-found: ignore
          retention-days: 14

      - name: Unit tests
        run: make test-unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  infra:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.10.7'

      - name: Format and validate
        run: make infra-check

  images:
    name: Container images
    needs: [test, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag and registry
        id: tag
        run: |
          echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build images once for AKS
        env:
          API_IMAGE: ${{ env.REGISTRY }}/mydisk-api:${{ github.sha }}
          MIGRATIONS_IMAGE: ${{ env.REGISTRY }}/mydisk-api-migrations:${{ github.sha }}
        run: make security-build

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Scan both images and enforce policy
        env:
          API_IMAGE: ${{ env.REGISTRY }}/mydisk-api:${{ github.sha }}
          MIGRATIONS_IMAGE: ${{ env.REGISTRY }}/mydisk-api-migrations:${{ github.sha }}
        run: make security-images

      - name: Upload complete image reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-reports
          path: security-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GHCR
        if: ${{ inputs.push-images }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned images without rebuilding
        if: ${{ inputs.push-images }}
        run: |
          docker push "$REGISTRY/mydisk-api:${GITHUB_SHA}"
          docker push "$REGISTRY/mydisk-api-migrations:${GITHUB_SHA}"
